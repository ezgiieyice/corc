<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CORC — AI Language Player</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --panel: #171a21;
      --panel2: #1f2430;
      --text: #f5f7fa;
      --muted: #aab2bf;
      --border: #343b4a;
      --accent: #7aa2f7;
      --accent-soft: rgba(122, 162, 247, .16);
    }

    :root {
      color-scheme: dark;

      --bg: #080a0f;
      --panel: #10131a;
      --panel2: #171b24;

      --text: #f7f8fa;
      --muted: #8e95a5;

      --border: rgba(255, 255, 255, 0.08);

      --accent: #8b5cf6;
      --accent2: #5b8cff;

      --accent-soft: rgba(139, 92, 246, 0.16);

      --success: #34d399;

      --shadow:
        0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(139, 92, 246, 0.16),
          transparent 40%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(91, 140, 255, 0.08),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);
    }

    .app {
      width: min(1180px, calc(100% - 36px));
      margin: 0 auto 60px;
      padding-top: 28px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .logo {
      width: 46px;
      height: 46px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          var(--accent2)
        );

      color: white;

      font-size: 22px;
      font-weight: 800;

      box-shadow:
        0 8px 30px rgba(139, 92, 246, 0.28);
    }

    .brand h1 {
      margin: 0;

      font-size: 22px;
      line-height: 1;

      letter-spacing: 0.08em;
    }

    .brand p {
      margin: 6px 0 0;

      color: var(--muted);

      font-size: 12px;
    }

    .ai-badge {
      display: flex;
      align-items: center;
      gap: 7px;

      padding: 8px 12px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background:
        rgba(255, 255, 255, 0.035);

      color: var(--muted);

      font-size: 12px;
      font-weight: 600;
    }

    .ai-badge span {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--success);

      box-shadow:
        0 0 12px var(--success);
    }

    .topbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .upload-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 16px;

      margin-bottom: 18px;
    }

    .upload-actions {
      display: flex;
      align-items: center;

      gap: 10px;

      flex-wrap: wrap;
    }

    .upload-btn {
      display: flex;
      align-items: center;

      gap: 11px;

      min-width: 190px;

      padding: 11px 15px;

      border: 1px solid var(--border);
      border-radius: 13px;

      background: var(--panel);

      cursor: pointer;

      transition:
        transform .15s ease,
        border-color .15s ease,
        background .15s ease;
    }

    .upload-btn:hover {
      transform: translateY(-1px);

      border-color:
        rgba(139, 92, 246, .65);

      background: var(--panel2);
    }

    .upload-btn input {
      display: none;
    }

    .upload-btn strong {
      display: block;

      color: var(--text);

      font-size: 13px;
      font-weight: 650;
    }

    .upload-btn small {
      display: block;

      margin-top: 2px;

      color: var(--muted);

      font-size: 10px;
    }

    .primary-upload {
      background:
        linear-gradient(
          135deg,
          rgba(139, 92, 246, .20),
          rgba(91, 140, 255, .10)
        );

      border-color:
        rgba(139, 92, 246, .35);
    }

    .upload-icon {
      width: 32px;
      height: 32px;

      display: grid;
      place-items: center;

      flex-shrink: 0;

      border-radius: 9px;

      background:
        rgba(139, 92, 246, .14);

      color: #b9a1ff;

      font-size: 20px;
    }

    .status-pill {
      display: flex;
      align-items: center;

      gap: 8px;

      padding: 8px 12px;

      border: 1px solid var(--border);
      border-radius: 999px;

      background:
        rgba(255, 255, 255, .025);

      color: var(--muted);

      font-size: 12px;
    }

    .status-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #737b8c;
    }

    @media (max-width: 700px) {

      .upload-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .upload-btn {
        flex: 1;
      }

      .status-pill {
        width: fit-content;
      }
    }

    .status {
      font-size: 13px;
      color: var(--muted);
    }

    .player-shell {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
    }

    video {
      display: block;
      width: 100%;
      max-height: 62vh;
      background: #000;
    }

    .subtitle-area {
      padding: 22px 18px 18px;
      text-align: center;
    }

    .sentence {
      min-height: 74px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 7px;
      justify-content: center;
      align-items: center;
      font-size: clamp(24px, 4vw, 42px);
      line-height: 1.35;
      font-weight: 600;
    }

    .word {
      display: inline-block;
      padding: 3px 7px;
      border: 2px solid transparent;
      border-radius: 9px;
      cursor: pointer;
      transition: background .08s ease, border-color .08s ease, transform .08s ease;
      user-select: none;
    }

    .word:hover {
      background: var(--panel2);
    }

    .word.active {
      border-color: var(--accent);
      background: var(--accent-soft);
      transform: translateY(-1px);
    }

    .translation {
      min-height: 34px;
      margin-top: 10px;
      color: var(--muted);
      font-size: clamp(16px, 2.2vw, 22px);
      line-height: 1.4;
      font-weight: 500;
    }

    .empty {
      color: var(--muted);
      font-size: 18px;
      font-weight: 500;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      padding: 0 18px 20px;
    }

    button, select {
      border: 1px solid var(--border);
      background: var(--panel2);
      color: var(--text);
      border-radius: 10px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }

    button:hover, select:hover {
      border-color: var(--accent);
    }

    button.primary {
      border-color: var(--accent);
    }

    .timeline {
      font-variant-numeric: tabular-nums;
      font-size: 13px;
      color: var(--muted);
      min-width: 120px;
      text-align: center;
    }

    .transcript {
      margin-top: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      max-height: 320px;
      overflow: auto;
    }

    .transcript-title {
      margin: 2px 4px 10px;
      font-size: 13px;
      color: var(--muted);
    }

    .segment-row {
      display: grid;
      grid-template-columns: 78px 1fr;
      gap: 10px;
      padding: 10px;
      border-radius: 10px;
      cursor: pointer;
    }

    .segment-row:hover {
      background: var(--panel2);
    }

    .segment-row.active {
      background: var(--accent-soft);
    }

    .segment-time {
      color: var(--muted);
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      padding-top: 2px;
    }

    .segment-text {
      line-height: 1.45;
    }

    .hint {
      margin-top: 12px;
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 640px) {
      .app { width: min(100% - 16px, 1100px); margin-top: 10px; }
      .sentence { font-size: 24px; }
      .segment-row { grid-template-columns: 62px 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand-header">
      <div class="brand">
        <div class="logo">
          C
        </div>
        <div>
          <h1>CORC</h1>
          <p>Watch. Understand. Learn.</p>
        </div>
      </div>
      <div class="ai-badge">
        <span></span>
        AI powered
      </div>
    </header>
    <div class="upload-bar">
      <div class="upload-actions">
        <label class="upload-btn primary-upload">

          <input
            id="videoInput"
            type="file"
            accept="video/*,audio/*"
          >
          <span class="upload-icon">＋</span>
          <span>
            <strong>Video seç</strong>
            <small>MP4, WebM, MP3, WAV</small>
          </span>
        </label>
        <label class="upload-btn secondary-upload">

          <input
            id="jsonInput"
            type="file"
            accept=".json,application/json"
          >

          <span class="upload-icon">⌁</span>
          <span>
            <strong>Altyazı JSON</strong>
            <small>Test modu</small>
          </span>
        </label>
      </div>
      <div id="status" class="status-pill">
        <span class="status-dot"></span>
        <span>Dosya bekleniyor</span>
      </div>
    </div>

    <section class="player-shell">
      <video id="video" controls preload="metadata"></video>

      <div class="subtitle-area">
        <div id="sentence" class="sentence">
          <span class="empty">Altyazı bekleniyor…</span>
        </div>
        <div id="translation" class="translation"></div>
      </div>

      <div class="controls">
        <button id="prevBtn" type="button">← Önceki cümle</button>
        <button id="repeatBtn" type="button" class="primary">↻ Cümleyi tekrar et</button>
        <button id="nextBtn" type="button">Sonraki cümle →</button>

        <label>
          <select id="speedSelect" aria-label="Oynatma hızı">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
          </select>
        </label>

        <span id="timeline" class="timeline">00:00 / 00:00</span>
      </div>
    </section>

    <section class="transcript">
      <div class="transcript-title">Transkript — bir cümleye tıklarsan video oraya gider.</div>
      <div id="transcriptList"></div>
    </section>

    <div class="hint">
      Her şey bu tarayıcı sekmesinde local çalışır. Video veya JSON hiçbir yere gönderilmez.
    </div>
  </main>

  <script>
    const video = document.getElementById('video');
    const videoInput = document.getElementById('videoInput');
    const jsonInput = document.getElementById('jsonInput');
    const sentenceEl = document.getElementById('sentence');
    const translationEl = document.getElementById('translation');
    const transcriptList = document.getElementById('transcriptList');
    const statusEl = document.getElementById('status');
    const timelineEl = document.getElementById('timeline');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const repeatBtn = document.getElementById('repeatBtn');
    const speedSelect = document.getElementById('speedSelect');

    let segments = [];
    let currentSegmentIndex = -1;
    let currentWordIndex = -1;
    let videoUrl = null;
    let rafId = null;

    function normalizeData(data) {
      const raw = Array.isArray(data) ? data : (data.segments || []);
      return raw
        .map(seg => ({
          start: Number(seg.start ?? 0),
          end: Number(seg.end ?? 0),
          text: String(seg.text ?? '').trim(),
          translation: String(seg.translation ?? seg.tr ?? '').trim(),
          words: Array.isArray(seg.words)
            ? seg.words.map(w => ({
                word: String(w.word ?? w.text ?? '').trim(),
                start: Number(w.start ?? seg.start ?? 0),
                end: Number(w.end ?? seg.end ?? 0)
              })).filter(w => w.word)
            : []
        }))
        .filter(seg => Number.isFinite(seg.start) && Number.isFinite(seg.end));
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds)) return '00:00';
      const s = Math.max(0, Math.floor(seconds));
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      return h > 0
        ? `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
        : `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
    }

    function findSegmentIndex(time) {
      if (!segments.length) return -1;

      if (
        currentSegmentIndex >= 0 &&
        currentSegmentIndex < segments.length &&
        time >= segments[currentSegmentIndex].start &&
        time <= segments[currentSegmentIndex].end
      ) return currentSegmentIndex;

      let lo = 0, hi = segments.length - 1;
      while (lo <= hi) {
        const mid = (lo + hi) >> 1;
        const seg = segments[mid];
        if (time < seg.start) hi = mid - 1;
        else if (time > seg.end) lo = mid + 1;
        else return mid;
      }
      return -1;
    }

    function findWordIndex(seg, time) {
      if (!seg || !seg.words.length) return -1;
      for (let i = 0; i < seg.words.length; i++) {
        const w = seg.words[i];
        if (time >= w.start && time <= w.end) return i;
      }
      return -1;
    }

    function renderSentence(segIndex) {
      sentenceEl.innerHTML = '';
      currentWordIndex = -1;

      if (segIndex < 0 || !segments[segIndex]) {
        const span = document.createElement('span');
        span.className = 'empty';
        span.textContent = '…';
        sentenceEl.appendChild(span);
        translationEl.textContent = '';
        return;
      }

      const seg = segments[segIndex];
      translationEl.textContent = seg.translation || '';

      if (!seg.words.length) {
        const span = document.createElement('span');
        span.textContent = seg.text;
        sentenceEl.appendChild(span);
        return;
      }

      seg.words.forEach((w, index) => {
        const span = document.createElement('span');
        span.className = 'word';
        span.textContent = w.word;
        span.dataset.wordIndex = index;
        span.title = `${formatTime(w.start)} — tıklayınca bu kelimeye gider`;
        span.addEventListener('click', () => {
          video.currentTime = Math.max(0, w.start - 0.05);
          video.play();
        });
        sentenceEl.appendChild(span);
      });
    }

    function setActiveWord(wordIndex) {
      if (wordIndex === currentWordIndex) return;

      const oldWord = sentenceEl.querySelector('.word.active');
      if (oldWord) oldWord.classList.remove('active');

      currentWordIndex = wordIndex;

      if (wordIndex >= 0) {
        const nextWord = sentenceEl.querySelector(`.word[data-word-index="${wordIndex}"]`);
        if (nextWord) nextWord.classList.add('active');
      }
    }

    function setActiveTranscript(segIndex) {
      transcriptList.querySelectorAll('.segment-row.active').forEach(el => el.classList.remove('active'));
      if (segIndex >= 0) {
        const row = transcriptList.querySelector(`[data-segment-index="${segIndex}"]`);
        if (row) {
          row.classList.add('active');

          // Sadece transcript kutusunu kendi içinde kaydır.
          // Sayfanın/video alanının aşağı-yukarı hareket etmesini engeller.
          const container = document.querySelector('.transcript');
          const rowTop = row.offsetTop;
          const rowBottom = rowTop + row.offsetHeight;
          const visibleTop = container.scrollTop;
          const visibleBottom = visibleTop + container.clientHeight;

          if (rowTop < visibleTop) {
            container.scrollTop = rowTop;
          } else if (rowBottom > visibleBottom) {
            container.scrollTop = rowBottom - container.clientHeight;
          }
        }
      }
    }

    function updateUI() {
      const t = video.currentTime || 0;
      const segIndex = findSegmentIndex(t);

      if (segIndex !== currentSegmentIndex) {
        currentSegmentIndex = segIndex;
        renderSentence(segIndex);
        setActiveTranscript(segIndex);
      }

      if (segIndex >= 0) {
        const wordIndex = findWordIndex(segments[segIndex], t);
        setActiveWord(wordIndex);
      } else {
        setActiveWord(-1);
      }

      timelineEl.textContent = `${formatTime(t)} / ${formatTime(video.duration)}`;
    }

    function animationLoop() {
      updateUI();
      rafId = requestAnimationFrame(animationLoop);
    }

    function startLoop() {
      if (rafId === null) rafId = requestAnimationFrame(animationLoop);
    }

    function stopLoop() {
      if (rafId !== null) {
        cancelAnimationFrame(rafId);
        rafId = null;
      }
      updateUI();
    }

    function renderTranscript() {
      transcriptList.innerHTML = '';

      segments.forEach((seg, index) => {
        const row = document.createElement('div');
        row.className = 'segment-row';
        row.dataset.segmentIndex = index;

        const time = document.createElement('div');
        time.className = 'segment-time';
        time.textContent = formatTime(seg.start);

        const text = document.createElement('div');
        text.className = 'segment-text';
        text.textContent = seg.text || seg.words.map(w => w.word).join(' ');

        row.append(time, text);
        row.addEventListener('click', () => {
          video.currentTime = Math.max(0, seg.start);
          video.play();
        });

        transcriptList.appendChild(row);
      });
    }

    videoInput.addEventListener('change', () => {
      const file = videoInput.files?.[0];
      if (!file) return;

      if (videoUrl) URL.revokeObjectURL(videoUrl);
      videoUrl = URL.createObjectURL(file);
      video.src = videoUrl;
      statusEl.textContent = `Video: ${file.name}`;
    });

    jsonInput.addEventListener('change', async () => {
      const file = jsonInput.files?.[0];
      if (!file) return;

      try {
        const text = await file.text();
        const data = JSON.parse(text);
        segments = normalizeData(data).sort((a, b) => a.start - b.start);
        currentSegmentIndex = -1;
        currentWordIndex = -1;
        renderTranscript();
        renderSentence(-1);
        statusEl.textContent = `${segments.length} altyazı segmenti yüklendi.`;
        updateUI();
      } catch (err) {
        console.error(err);
        alert('JSON okunamadı. Whisper _words.json dosyasını seçtiğinden emin ol.');
      }
    });

    prevBtn.addEventListener('click', () => {
      if (!segments.length) return;
      let idx = currentSegmentIndex;
      if (idx < 0) idx = 0;
      else idx = Math.max(0, idx - 1);
      video.currentTime = segments[idx].start;
      video.play();
    });

    nextBtn.addEventListener('click', () => {
      if (!segments.length) return;
      let idx = currentSegmentIndex;
      if (idx < 0) idx = 0;
      else idx = Math.min(segments.length - 1, idx + 1);
      video.currentTime = segments[idx].start;
      video.play();
    });

    repeatBtn.addEventListener('click', () => {
      if (currentSegmentIndex < 0 || !segments[currentSegmentIndex]) return;
      video.currentTime = Math.max(0, segments[currentSegmentIndex].start - 0.05);
      video.play();
    });

    speedSelect.addEventListener('change', () => {
      video.playbackRate = Number(speedSelect.value);
    });

    video.addEventListener('play', startLoop);
    video.addEventListener('pause', stopLoop);
    video.addEventListener('ended', stopLoop);
    video.addEventListener('seeked', updateUI);
    video.addEventListener('loadedmetadata', updateUI);

    window.addEventListener('beforeunload', () => {
      if (videoUrl) URL.revokeObjectURL(videoUrl);
    });
  </script>
</body>
</html>
